server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico)$ {
        try_files $uri =404;
        expires 1h;
    }
}
